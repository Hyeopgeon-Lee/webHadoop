<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebHDFS 파일 관리</title>
    <link rel="stylesheet" href="/css/table.css">
    <script src="/js/jquery-3.6.0.min.js"></script>
    <script>
        function showError(prefix, xhr) {
            const detail = xhr.responseJSON && xhr.responseJSON.message
                ? xhr.responseJSON.message : (xhr.statusText || "알 수 없는 오류");
            alert(prefix + ": " + detail);
        }

        function doDelete(path) {
            if (!confirm(path + " 파일을 삭제하시겠습니까?")) return;
            // DELETE parameters are sent in the query string, not the request body.
            $.ajax({
                url: "/webhdfs/v1/delete?path=" + encodeURIComponent(path),
                method: "DELETE"
            }).done(function () {
                alert("삭제되었습니다.");
                doList();
            }).fail(function (xhr) {
                showError("파일 삭제 실패", xhr);
            });
        }

        function doList() {
            $.ajax({
                url: "/webhdfs/v1/list",
                method: "GET",
                dataType: "json"
            }).done(function (response) {
                try {
                    const parsed = JSON.parse(response.data);
                    const files = parsed.FileStatuses.FileStatus || [];
                    const tbody = $("#hdfsData").empty();
                    for (const file of files) {
                        // Always use text() for data originating from Hadoop.
                        const row = $("<div>").addClass("divTableRow");
                        row.append($("<div>").addClass("divTableCell").text(file.type));
                        const pathCell = $("<div>").addClass("divTableCell");
                        if (file.type === "FILE") {
                            $("<button>").attr("type", "button")
                                .text("삭제: " + file.pathSuffix)
                                .on("click", function () { doDelete(file.pathSuffix); })
                                .appendTo(pathCell);
                        } else {
                            pathCell.text(file.pathSuffix || "/");
                        }
                        row.append(pathCell);
                        row.append($("<div>").addClass("divTableCell").text(file.owner));
                        row.append($("<div>").addClass("divTableCell").text(file.group));
                        row.append($("<div>").addClass("divTableCell").text(file.permission));
                        row.append($("<div>").addClass("divTableCell").text(formatDate(file.modificationTime)));
                        tbody.append(row);
                    }
                } catch (e) {
                    $("#hdfsData").empty();
                    alert("파일 목록 응답을 해석할 수 없습니다.");
                }
            }).fail(function (xhr) {
                $("#hdfsData").empty();
                showError("파일 목록 조회 실패", xhr);
            });
        }

        function formatDate(timestamp) {
            const d = new Date(timestamp);
            if (Number.isNaN(d.getTime())) return "-";
            const pad = n => String(n).padStart(2, "0");
            return d.getFullYear() + "-" + pad(d.getMonth() + 1)
                + "-" + pad(d.getDate()) + " "
                + pad(d.getHours()) + ":" + pad(d.getMinutes());
        }

        $(function () {
            $("#btnSend").on("click", function () {
                $.ajax({
                    url: "/webhdfs/v1/upload",
                    method: "POST",
                    dataType: "json",
                    data: $("#f").serialize()
                }).done(function (response) {
                    alert("파일 업로드 성공: " + response.message);
                    doList();
                }).fail(function (xhr) {
                    showError("파일 업로드 실패", xhr);
                });
            });
            doList();
        });
    </script>
</head>
<body>
<h2>하둡 분산파일시스템 WebHDFS API 파일 업로드·조회·삭제 실습</h2>
<hr>
<form id="f" name="f">
    <div class="divTable minimalistBlack">
        <div class="divTableBody">
            <div class="divTableRow">
                <div class="divTableCell" style="width:30%">업로드할 파일 이름</div>
                <div class="divTableCell" style="width:70%">
                    <input name="path" type="text" required style="width:98%" placeholder="example.txt (상대 경로)">
                </div>
            </div>
            <div class="divTableRow">
                <div class="divTableCell">업로드할 텍스트 내용</div>
                <div class="divTableCell">
                    <textarea name="content" style="width:98%"></textarea>
                </div>
            </div>
        </div>
    </div>
    <button id="btnSend" type="button">파일 업로드</button>
</form>
<div class="divTable minimalistBlack">
    <div class="divTableHeading">
        <div class="divTableRow">
            <div class="divTableHead">구분</div>
            <div class="divTableHead">파일명 / 작업</div>
            <div class="divTableHead">소유자</div>
            <div class="divTableHead">그룹</div>
            <div class="divTableHead">권한</div>
            <div class="divTableHead">수정일</div>
        </div>
    </div>
    <div class="divTableBody" id="hdfsData"></div>
</div>
</body>
</html>
