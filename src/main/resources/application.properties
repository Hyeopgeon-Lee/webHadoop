# Local server for the WebHDFS practice UI
server.port=11000

# Set these in the environment for your Hadoop installation.
webhdfs.base-url=${WEBHDFS_BASE_URL:http://localhost:9870/webhdfs/v1}
webhdfs.username=${WEBHDFS_USER:hadoop}
webhdfs.upload-dir=${WEBHDFS_UPLOAD_DIR:/01}

# Only URL-encoded text is uploaded in this example.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
